<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS API Caller</title>

  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <h1>JS API Caller</h1>
  <p class="subtitle">Enter any REST API URL — the JSON response will appear below.</p>

  <div class="form-row">
    <input
      type="text"
      id="url-input"
      placeholder="https://jsonplaceholder.typicode.com/todos/1"
      autofocus
    >
    <button id="submit-btn" onclick="callAPI()">Submit</button>
  </div>

  <div id="result"></div>

  <script src="scripts.js"></script>
</body>
</html>
